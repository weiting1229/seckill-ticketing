# 共用設定(所有 profile 生效)。
# 敏感值一律走環境變數;本檔禁止出現任何祕密。
# 資料來源等連線設定放在 dev / prod profile 文件中,
# 整合測試由 Testcontainers @ServiceConnection 提供連線,不讀本檔的連線設定。
spring:
  application:
    name: seckill-backend
  threads:
    virtual:
      enabled: true   # Java 25 Virtual Threads
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 全站唯一的上傳端點是 admin 的內容包匯入(一次一包 manifest + N 張海報)。
      # max-file-size 與 seckill.posters.max-file-bytes 是兩道不同的關卡,不可只留一道:
      #   前者由 Tomcat 在讀進記憶體/暫存檔之前就擋掉,後者是業務層的檔名級錯誤訊息。
      # 只留後者的話,超大檔仍會被完整收下才被拒;只留前者則錯誤是 Tomcat 的,沒有檔名。
      max-file-size: 2MB
      # 整包上限。實測 2026-09-06 的內容包是 46 張 / 2.81 MB;計畫 §10.1 對成長的估計是
      # 120 張約 18 MB。32MB 留了餘裕又不至於讓單一請求吃掉整個堆積。
      max-request-size: 32MB
  rabbitmq:
    # 生產端可靠性(設計文件第 7 節):correlated confirms + mandatory + returns,
    # 供 OrderMessagePublisher 同步判定發送成功;失敗則回補 Redis。
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手動 ack:業務成功才 ack(設計文件第 7 節);消費併發從 4 起,依壓測調整
        acknowledge-mode: manual
        concurrency: 4

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

seckill:
  id:
    # 單機 MVP 固定 0;未來多實例改由啟動時從 Redis 分配
    worker-id: ${WORKER_ID:0}
    datacenter-id: ${DATACENTER_ID:0}
  jwt:
    # 至少 256 bit;一律由環境變數注入,禁止硬編碼
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  cors:
    # 逗號分隔;dev 允許本機前端,prod 由環境變數覆蓋為正式網域
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # ADMIN 種子帳號(環境變數驅動,兩者皆設才建立;不設則略過)。憑證不入 repo。
    username: ${SECKILL_ADMIN_USERNAME:}
    password: ${SECKILL_ADMIN_PASSWORD:}
  posters:
    # 海報落地目錄。prod 由 compose 掛主機的 /opt/seckill/posters 進來並以 env 指向它;
    # dev 用 repo 外的本機目錄,整合測試由 @DynamicPropertySource 指到暫存目錄。
    # 對外 URL 兩邊都是 /posters/<檔名>,前端不需要區分環境(計畫 §4.6)。
    dir: ${SECKILL_POSTERS_DIR:./data/posters}
    max-file-bytes: ${SECKILL_POSTERS_MAX_FILE_BYTES:2097152}   # 2 MB;實測單張最大 147 KB
    min-dimension: ${SECKILL_POSTERS_MIN_DIMENSION:640}         # 擋解壓縮炸彈與異常尺寸
    max-dimension: ${SECKILL_POSTERS_MAX_DIMENSION:4096}
  ratelimit:
    # 搶購限流(Bucket4j + Redis)。每秒容量;正式環境可依壓測經 env 覆寫(設計文件第 10 節)。
    global-capacity: ${SECKILL_RL_GLOBAL:3000}          # 全域 QPS 上限(/seckill/purchase)
    user-capacity: ${SECKILL_RL_USER:2}                 # 單用戶對 /seckill/purchase 每秒
    ip-capacity: ${SECKILL_RL_IP:10}                    # 單 IP 每秒(/seckill/purchase)
    token-user-capacity: ${SECKILL_RL_TOKEN_USER:5}     # 單用戶領 token(/seckill/token)每秒

order:
  delay:
    # 支付逾時取消延遲(設計文件第 7 節):order.delay.queue 的 x-message-ttl,預設 15 分鐘。
    # 所有環境一致(避免同名 durable 佇列以不同參數重複宣告);測試提速改用逐訊息 expiration(見 ADR 0005)。
    ttl-ms: ${ORDER_DELAY_TTL_MS:900000}
  expiry-sweep:
    # 兜底排程(belt-and-suspenders,設計文件第 5、7 節):防延遲訊息遺失,定期掃逾時未支付訂單取消回補。
    interval-ms: ${ORDER_EXPIRY_SWEEP_INTERVAL_MS:60000}          # fixedDelay 間隔
    initial-delay-ms: ${ORDER_EXPIRY_SWEEP_INITIAL_DELAY_MS:60000} # 啟動後首次延遲
    batch-limit: ${ORDER_EXPIRY_SWEEP_BATCH_LIMIT:500}            # 單次掃描批次上限

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # 僅暴露 health 與 prometheus,且僅限 Docker 內網存取
  metrics:
    distribution:
      # 為 HTTP 端點產生 histogram bucket,使 Prometheus 能算 API p99(設計文件第 11 節告警)。
      # 預設 http.server.requests 只有 count/sum/max,無 bucket,無法 histogram_quantile。
      percentiles-histogram:
        http.server.requests: true

server:
  port: 8080
  shutdown: graceful

---
# ===== dev:本地開發(中介軟體由 infra/docker-compose.dev.yml 提供)=====
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:seckill}
    username: ${POSTGRES_USER:seckill}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

seckill:
  posters:
    # dev 直接寫進前端的 publicDir,讓 Vite(:5173)當場就提供得出來 —— prod 走 Caddy
    # 的 /posters/*,兩邊對外路徑都是 /posters/<檔名>,前端程式碼不需要區分環境(計畫 §4.6)。
    #
    # ⚠ 相對路徑是相對於**啟動時的工作目錄**,而 runbook 的 dev 啟動方式是
    # `cd backend && ./mvnw spring-boot:run`,所以 ../frontend/... 才對得上。
    # 從 repo 根目錄啟動的話這個相對路徑會落在 repo 外面 —— 症狀是「匯入成功但前端看不到圖」,
    # 不會報錯。要從別處啟動就用 SECKILL_POSTERS_DIR 指絕對路徑。
    dir: ${SECKILL_POSTERS_DIR:../frontend/public/posters}
  ratelimit:
    # 消融測試開關(dev-only,壓測長尾延遲排查,見 HANDOFF.md「隔離限流器自己的排隊 bug」):
    # 開啟後 tryGlobal/tryUser/tryIp/tryTokenUser 整段跳過、不呼叫 Redis,直接放行,
    # 用來把「限流器排隊」與「下游真實承載上限」兩件事分開測。
    # 這個 key 只存在於 dev profile;prod profile 沒有對應設定,@Value 預設值 false 生效,
    # 即使誤設 SECKILL_RL_BYPASS 環境變數也不會在 prod 生效。測完記得改回 false 或整段拿掉。
    bypass-enabled: ${SECKILL_RL_BYPASS:false}

---
# ===== prod:正式環境(容器間以 Docker 內網服務名互連,全部由環境變數注入)=====
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
